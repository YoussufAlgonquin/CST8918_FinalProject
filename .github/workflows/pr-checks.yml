name: Terraform PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - infra/tf-backend
          - infra/modules/network
          - infra/modules/aks
          - infra/modules/weather-app
          - infra/envs/test
          - infra/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint --init
        working-directory: ${{ matrix.working-directory }}
        run: tflint --init --config="${{ github.workspace }}/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tflint
        working-directory: ${{ matrix.working-directory }}
        run: tflint --config="${{ github.workspace }}/.tflint.hcl"

  # Live against real Azure state via the cst8918fp-gha-r identity (Reader
  # + Azure Kubernetes Service Cluster User Role + Redis Cache Contributor
  # - Reader alone can't refresh AKS/Redis state, since listing credentials
  # and cache keys aren't included in it). If the four secrets below are
  # ever unset, the job skips cleanly instead of failing.
  terraform-plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [test, prod]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check plan prerequisites
        id: plan_ready
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
        run: |
          missing=()
          [ -z "$AZURE_CLIENT_ID" ] && missing+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ] && missing+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ] && missing+=("AZURE_SUBSCRIPTION_ID")
          [ -z "$ARM_ACCESS_KEY" ] && missing+=("ARM_ACCESS_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=terraform-plan skipped::Missing secrets: ${missing[*]}. Expected until issue #8 — plan not run."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All required secrets present — running terraform plan for ${{ matrix.environment }}."
          fi

      - name: Skipped (secrets incomplete)
        if: steps.plan_ready.outputs.ready != 'true'
        run: echo "No terraform plan executed for this matrix entry."

      - if: steps.plan_ready.outputs.ready == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - if: steps.plan_ready.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: terraform init
        if: steps.plan_ready.outputs.ready == 'true'
        working-directory: infra/envs/${{ matrix.environment }}
        run: terraform init
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}

      - name: terraform plan
        if: steps.plan_ready.outputs.ready == 'true'
        working-directory: infra/envs/${{ matrix.environment }}
        run: terraform plan -input=false -no-color
        env:
          # Backend credentials are not persisted after init.
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
