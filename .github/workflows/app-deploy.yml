name: Deploy Weather App

# Deploys the Remix Weather App to AKS, only when app code changes:
#   - pull_request to main  -> test environment (for PR review)
#   - push to main (merge)  -> prod environment

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
  push:
    branches: [main]
    paths:
      - 'app/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-test:
    if: github.event_name == 'pull_request'
    name: deploy-test
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: get AKS credentials
        run: az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME_TEST }} --overwrite-existing

      - name: set image and rollout
        run: |
          kubectl set image deployment/weather-app weather-app=${{ secrets.ACR_NAME }}.azurecr.io/weather-app:${{ github.sha }}
          kubectl rollout status deployment/weather-app

  deploy-prod:
    if: github.event_name == 'push'
    name: deploy-prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: get AKS credentials
        run: az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME_PROD }} --overwrite-existing

      - name: set image and rollout
        run: |
          kubectl set image deployment/weather-app weather-app=${{ secrets.ACR_NAME }}.azurecr.io/weather-app:${{ github.sha }}
          kubectl rollout status deployment/weather-app
