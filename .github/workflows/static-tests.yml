name: Terraform Static Tests

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  fmt-validate:
    name: fmt-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - infra/tf-backend
          - infra/modules/network
          - infra/modules/aks
          - infra/modules/weather-app
          - infra/envs/test
          - infra/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: terraform fmt -check
        working-directory: ${{ matrix.working-directory }}
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.working-directory }}
        run: terraform validate

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
          soft_fail: false
          # Without this, the action's own version-check call to the GitHub
          # API is anonymous and shares runner IPs with everyone else on
          # GitHub-hosted runners - it gets rate-limited intermittently,
          # failing this required check for reasons unrelated to our code.
          github_token: ${{ secrets.GITHUB_TOKEN }}
