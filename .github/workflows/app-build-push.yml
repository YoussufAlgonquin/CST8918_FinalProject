name: Build and Push Weather App Image

# Builds the Remix Weather App and pushes it to ACR, tagged with the
# commit SHA, only when app code changes and only on PRs to main.
#
# TODO(owner): needs the ACR from infra/modules/weather-app to exist, and
# ACR_NAME / Azure login secrets configured. See docs/task-breakdown.md.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az acr login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: docker build and push
        working-directory: app
        run: |
          IMAGE="${{ secrets.ACR_NAME }}.azurecr.io/weather-app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
